map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 登录接口按经过 real_ip 模块校正后的来源 IP 限速。10 MB 可保存约十万级活跃地址状态。
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=10r/m;
limit_req_log_level warn;

server {
    listen 8001;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # 后端当前会将上传内容读入内存，因此这里先采用明确且保守的 50 MB 上限。
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/auth/login {
        client_max_body_size 4k;
        limit_req zone=login_per_ip burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_rate_limited;

        proxy_pass         http://127.0.0.1:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # 覆盖客户端自带的 XFF，后端不会再信任任意来源的转发链。
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    }

    location @login_rate_limited {
        default_type application/json;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"detail":"登录请求过于频繁，请稍后再试"}';
    }

    location /api/ {
        # 前后端合一镜像：FastAPI 与 Nginx 位于同一容器。
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    }
}
