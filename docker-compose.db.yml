# 开发阶段只跑数据库
# 用法：docker compose -f docker-compose.db.yml up -d
version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-RagProd2026}
      POSTGRES_DB: ${POSTGRES_DB:-rag_prod}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
