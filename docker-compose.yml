name: ${COMPOSE_PROJECT_NAME:-rag}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app-common
  image: ${IMAGE_REPOSITORY:-rag}:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
  env_file:
    - .env
  environment:
    DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:?请先在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rag_prod}"
    JWT_SECRET: "${JWT_SECRET:-}"
    ADMIN_INIT_PASSWORD: "${ADMIN_INIT_PASSWORD:-}"
  networks:
    - application
    - database
  logging: *default-logging

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请先在 .env 中设置 POSTGRES_PASSWORD}"
      POSTGRES_DB: ${POSTGRES_DB:-rag_prod}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # 仅绑定宿主机环回地址：方便本地开发，同时不会把数据库暴露到公网。
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - database
    logging: *default-logging

  # 数据库迁移是一次性任务；成功后正常显示 Exited (0)。
  migrate:
    <<: *app-common
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app-common
    restart: unless-stopped
    init: true
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/rag.conf"]
    expose:
      - "8001"
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${APP_PORT:-8001}:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - upload_data:/app/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    stop_grace_period: 30s

networks:
  application:
  database:

volumes:
  pg_data:
  upload_data:
