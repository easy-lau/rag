version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      # 默认密码仅为零配置首次部署方便；生产请在 .env 里覆盖 POSTGRES_PASSWORD（只用字母+数字）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-RagProd2026}
      POSTGRES_DB: ${POSTGRES_DB:-rag_prod}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-RagProd2026}@postgres:5432/${POSTGRES_DB:-rag_prod}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - backend

volumes:
  pg_data:
  upload_data:
